
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-guests"
version = "1.0.0"
description = "Wi-Fi QR Code and printable card generator"
requires-python = ">=3.10"
dependencies = [
    "qrcode[pil]>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
